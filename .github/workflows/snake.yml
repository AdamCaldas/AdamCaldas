name: Serpente da Forja

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpente.svg?palette=github-dark&color_snake=#f0a24a&color_dots=#161b22,#3d2410,#7a3e10,#c4600f,#ff8a1f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "forja: atualiza serpente"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
