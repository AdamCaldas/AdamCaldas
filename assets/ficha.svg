<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <style>
    .t   { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono','Courier New',monospace; font-size: 14px; fill: #c9d1d9; }
    .dim { fill: #6e7681; }
    .k   { fill: #f0a24a; font-weight: 700; }
    .acc { fill: #00d4aa; }
    .art { fill: #f0a24a; font-size: 13px; white-space: pre; }
    .hot { fill: #ff6a00; }

    .ln  { opacity: 0; animation: in .2s ease-out forwards; }
    @keyframes in { to { opacity: 1 } }

    .type { animation: type 1s steps(9,end) .3s forwards; }
    @keyframes type { to { transform: translateX(110px) } }

    .cursor { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 50% { opacity: 0 } }

    .glow { animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { fill: #b8420a } 50% { fill: #ffb347 } }

    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s steps(20,end) forwards; }
    @keyframes grow { to { transform: scaleX(1) } }
  </style>

  <!-- janela -->
  <rect x="0.5" y="0.5" width="999" height="419" rx="8" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 36 V8.5 a8 8 0 0 1 8 -8 H991.5 a8 8 0 0 1 8 8 V36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="1000" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="500" y="23" text-anchor="middle" class="t dim" font-size="12">adam@forge: ~</text>

  <!-- prompt -->
  <text x="28" y="70" class="t"><tspan class="acc">adam@forge</tspan><tspan class="dim">:</tspan><tspan fill="#58a6ff">~</tspan><tspan class="dim">$ </tspan>neofetch</text>
  <rect x="140" y="52" width="110" height="24" fill="#0d1117" class="type"/>

  <!-- arte ASCII: bigorna -->
  <g class="ln" style="animation-delay:1.4s">
    <text class="t art" x="36" y="130" xml:space="preserve"><tspan class="glow">            ▄▄▄▄▄▄▄▄▄▄</tspan></text>
    <text class="t art" x="36" y="148" xml:space="preserve"> ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄</text>
    <text class="t art" x="36" y="166" xml:space="preserve">▀▀▀▀▀▀███████████████████████</text>
    <text class="t art" x="36" y="184" xml:space="preserve">        ▀▀▀███████████████▀▀</text>
    <text class="t art" x="36" y="202" xml:space="preserve">             ██████████</text>
    <text class="t art" x="36" y="220" xml:space="preserve">             ██████████</text>
    <text class="t art" x="36" y="238" xml:space="preserve">          ▄████████████████▄</text>
    <text class="t art" x="36" y="256" xml:space="preserve">          ██████████████████</text>
    <text class="t art dim" x="40" y="296" xml:space="preserve">     ── forjando desde o boot ──</text>
  </g>

  <!-- informações -->
  <g>
    <text x="330" y="112" class="t ln" style="animation-delay:1.5s"><tspan class="acc" font-weight="700">adam</tspan><tspan class="dim">@</tspan><tspan class="acc" font-weight="700">forge</tspan></text>
    <text x="330" y="130" class="t dim ln" style="animation-delay:1.55s">─────────────────────────</text>
    <text x="330" y="154" class="t ln" style="animation-delay:1.6s"><tspan class="k">Role</tspan><tspan class="dim">:      </tspan>Full Stack Developer</text>
    <text x="330" y="176" class="t ln" style="animation-delay:1.7s"><tspan class="k">Uptime</tspan><tspan class="dim">:    </tspan>22 anos</text>
    <text x="330" y="198" class="t ln" style="animation-delay:1.8s"><tspan class="k">Host</tspan><tspan class="dim">:      </tspan>Boa Vista, RR · Brasil</text>
    <text x="330" y="220" class="t ln" style="animation-delay:1.9s"><tspan class="k">Kernel</tspan><tspan class="dim">:    </tspan>Ciência da Computação</text>
    <text x="330" y="242" class="t ln" style="animation-delay:2.0s"><tspan class="k">Languages</tspan><tspan class="dim">: </tspan>Go · TypeScript · C# · Python</text>
    <text x="330" y="264" class="t ln" style="animation-delay:2.1s"><tspan class="k">Backend</tspan><tspan class="dim">:   </tspan>Gin · GORM · REST · Keycloak</text>
    <text x="330" y="286" class="t ln" style="animation-delay:2.2s"><tspan class="k">Frontend</tspan><tspan class="dim">:  </tspan>Next.js · React · Tailwind</text>
    <text x="330" y="308" class="t ln" style="animation-delay:2.3s"><tspan class="k">Data</tspan><tspan class="dim">:      </tspan>PostgreSQL · Supabase · Firestore</text>
    <text x="330" y="330" class="t ln" style="animation-delay:2.4s"><tspan class="k">Infra</tspan><tspan class="dim">:     </tspan>Docker · Cloud Run · Vercel · Linux</text>
    <text x="330" y="352" class="t ln" style="animation-delay:2.5s"><tspan class="k">Focus</tspan><tspan class="dim">:     </tspan>APIs · automação · scraping</text>
  </g>

  <!-- paleta -->
  <g class="ln" style="animation-delay:2.7s">
    <rect x="330" y="368" width="26" height="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="356" y="368" width="26" height="14" fill="#ff5f57"/>
    <rect x="382" y="368" width="26" height="14" fill="#3fb950"/>
    <rect x="408" y="368" width="26" height="14" fill="#f0a24a"/>
    <rect x="434" y="368" width="26" height="14" fill="#58a6ff"/>
    <rect x="460" y="368" width="26" height="14" fill="#bc8cff"/>
    <rect x="486" y="368" width="26" height="14" fill="#00d4aa"/>
    <rect x="512" y="368" width="26" height="14" fill="#c9d1d9"/>
  </g>

  <!-- proficiência -->
  <g class="t" font-size="13">
    <text x="720" y="112" class="ln" style="animation-delay:2.8s"><tspan class="dim"># proficiência</tspan></text>

    <g class="ln" style="animation-delay:2.9s">
      <text x="720" y="142">go</text><text x="960" y="142" text-anchor="end" class="dim">90%</text>
      <rect x="720" y="150" width="240" height="6" fill="#21262d"/>
      <rect x="720" y="150" width="216" height="6" fill="#00d4aa" class="bar" style="animation-delay:2.9s"/>
    </g>
    <g class="ln" style="animation-delay:3.0s">
      <text x="720" y="184">typescript</text><text x="960" y="184" text-anchor="end" class="dim">85%</text>
      <rect x="720" y="192" width="240" height="6" fill="#21262d"/>
      <rect x="720" y="192" width="204" height="6" fill="#58a6ff" class="bar" style="animation-delay:3.0s"/>
    </g>
    <g class="ln" style="animation-delay:3.1s">
      <text x="720" y="226">sql / modelagem</text><text x="960" y="226" text-anchor="end" class="dim">80%</text>
      <rect x="720" y="234" width="240" height="6" fill="#21262d"/>
      <rect x="720" y="234" width="192" height="6" fill="#bc8cff" class="bar" style="animation-delay:3.1s"/>
    </g>
    <g class="ln" style="animation-delay:3.2s">
      <text x="720" y="268">arquitetura</text><text x="960" y="268" text-anchor="end" class="dim">78%</text>
      <rect x="720" y="276" width="240" height="6" fill="#21262d"/>
      <rect x="720" y="276" width="187" height="6" fill="#f0a24a" class="bar" style="animation-delay:3.2s"/>
    </g>
    <g class="ln" style="animation-delay:3.3s">
      <text x="720" y="310">devops</text><text x="960" y="310" text-anchor="end" class="dim">72%</text>
      <rect x="720" y="318" width="240" height="6" fill="#21262d"/>
      <rect x="720" y="318" width="173" height="6" fill="#3fb950" class="bar" style="animation-delay:3.3s"/>
    </g>
  </g>

  <!-- próximo prompt -->
  <text x="28" y="404" class="t ln" style="animation-delay:3.6s"><tspan class="acc">adam@forge</tspan><tspan class="dim">:</tspan><tspan fill="#58a6ff">~</tspan><tspan class="dim">$ </tspan><tspan class="cursor">▌</tspan></text>
</svg>
